name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@iliestefa'

      - name: Use published packages in CI
        run: |
          npm pkg set dependencies["@iliestefa/wedding-soho"]="latest"
          npm pkg set dependencies["@iliestefa/wedding-elegant"]="latest"

      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
        env:
          VITE_VALID_TOKENS: ${{ secrets.VITE_VALID_TOKENS }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_DRAFT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_DRAFT_TEMPLATE_ID }}
          VITE_EMAILJS_PURCHASE_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_PURCHASE_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_UPLOAD_ENDPOINT: ${{ secrets.VITE_UPLOAD_ENDPOINT }}
          VITE_UPLOAD_KEY: ${{ secrets.VITE_UPLOAD_KEY }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_WEDDINGS_API: ${{ secrets.VITE_WEDDINGS_API }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
