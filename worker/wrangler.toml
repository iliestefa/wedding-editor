# ─── Wedya Bodas — Worker ─────────────────────────────────────────────────────
# Sirve las invitaciones por slug (render en runtime, sin repos por cliente)
# y guarda los datos que envía el editor. Ver README.md para el deploy.

name = "wedya-bodas"
main = "src/index.js"
compatibility_date = "2026-08-01"

# La app viewer compilada (npm run build:viewer desde wedding-editor/)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Base de datos de invitaciones. En producción, crear con:
#   npx wrangler kv namespace create WEDDINGS
# y pegar el id que devuelve aquí abajo.
[[kv_namespaces]]
binding = "WEDDINGS"
id = "PENDIENTE_PEGAR_ID"
